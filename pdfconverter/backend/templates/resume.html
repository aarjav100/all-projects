<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Resume</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --bg: #ffffff;
      --text: #1f2937;
      --font: 'Inter', sans-serif;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); }
    .resume { max-width: 860px; margin: 0 auto; padding: 3rem 2rem; }
    header { border-bottom: 3px solid var(--primary); padding-bottom: 1.5rem; margin-bottom: 2rem; }
    h1 { font-size: 2.5rem; font-weight: 700; color: var(--text); }
    .tagline { color: var(--primary); font-size: 1.1rem; font-weight: 500; margin-top: 0.25rem; }
    .summary-box { background: #f8faff; border-left: 4px solid var(--primary); padding: 1rem 1.5rem; margin: 1.5rem 0; border-radius: 0 8px 8px 0; }
    .summary-box p { color: var(--text); line-height: 1.7; }
    section { margin-bottom: 2rem; }
    h2 { font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    ul li { padding: 0.35rem 0; padding-left: 1.2rem; position: relative; color: var(--text); }
    ul li::before { content: "▸"; position: absolute; left: 0; color: var(--primary); }
    p { line-height: 1.7; color: var(--muted); }
    @media print { body { font-size: 12px; } .resume { padding: 1rem; } }
    @media (max-width: 600px) { h1 { font-size: 1.8rem; } .resume { padding: 1.5rem 1rem; } }
  </style>
</head>
<body>
  <div class="resume">
    <header>
      <h1>{{TITLE}}</h1>
      <p class="tagline">Professional Resume · PDF Studio</p>
    </header>

    <div class="summary-box">
      <p>{{EXECUTIVE_SUMMARY}}</p>
    </div>

    <section>
      <h2>Key Skills &amp; Topics</h2>
      <ul>{{KEY_TOPICS}}</ul>
    </section>

    <section>
      <h2>Content</h2>
      {{CONTENT}}
    </section>
  </div>
</body>
</html>
