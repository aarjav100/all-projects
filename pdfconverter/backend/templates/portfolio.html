<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f0f1a;
      --text: #f9fafb;
      --font: 'Outfit', sans-serif;
      --muted: #9ca3af;
      --card-bg: #1a1a2e;
      --border: #2d2d44;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); }
    .hero { text-align: center; padding: 5rem 2rem 3rem; background: radial-gradient(ellipse at 50% 0%, rgba(99,102,241,0.2) 0%, transparent 70%); }
    .hero-badge { display: inline-block; border: 1px solid var(--primary); color: var(--primary); padding: 0.3rem 1rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; margin-bottom: 1.5rem; }
    h1 { font-size: 3.5rem; font-weight: 800; line-height: 1.1; background: linear-gradient(135deg, #fff 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-sub { color: var(--muted); font-size: 1.1rem; max-width: 560px; margin: 1rem auto 0; line-height: 1.7; }
    .skills { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; padding: 2rem 2rem 0; }
    .skill { background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3); color: var(--primary); padding: 0.35rem 1rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; padding: 3rem 2rem; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .card p { color: var(--muted); line-height: 1.7; font-size: 0.95rem; }
    footer { text-align: center; padding: 3rem 2rem; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--border); }
    @media (max-width: 600px) { h1 { font-size: 2.2rem; } .grid { grid-template-columns: 1fr; padding: 2rem 1rem; } }
  </style>
</head>
<body>
  <section class="hero">
    <span class="hero-badge">Portfolio</span>
    <h1>{{TITLE}}</h1>
    <p class="hero-sub">{{EXECUTIVE_SUMMARY}}</p>
  </section>

  <div class="skills">
    {{KEY_TOPICS}}
  </div>

  <div class="grid">
    {{CONTENT}}
  </div>

  <footer>Generated by PDF Studio · Portfolio Template</footer>

  <script>
    // Wrap skill items as badges
    const skillsEl = document.querySelector('.skills');
    skillsEl.querySelectorAll('li').forEach(li => {
      const span = document.createElement('span');
      span.className = 'skill';
      span.textContent = li.textContent;
      skillsEl.appendChild(span);
    });
    skillsEl.querySelector('ul')?.remove();

    // Wrap paragraphs as cards
    const grid = document.querySelector('.grid');
    grid.querySelectorAll('p').forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.appendChild(p.cloneNode(true));
      grid.appendChild(card);
    });
    grid.querySelectorAll(':scope > p').forEach(p => p.remove());
  </script>
</body>
</html>
