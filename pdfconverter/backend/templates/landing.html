<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --bg: #ffffff;
      --text: #1f2937;
      --font: 'Inter', sans-serif;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 3rem; border-bottom: 1px solid #e5e7eb; }
    .logo { font-weight: 700; font-size: 1.1rem; color: var(--primary); }
    .nav-cta { background: var(--primary); color: #fff; padding: 0.5rem 1.25rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; text-decoration: none; }
    .hero { text-align: center; padding: 6rem 2rem 4rem; background: linear-gradient(180deg, #eef2ff 0%, #ffffff 100%); }
    .hero-tag { display: inline-block; background: #ede9fe; color: var(--primary); padding: 0.3rem 1rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; margin-bottom: 1.5rem; }
    h1 { font-size: 3.8rem; font-weight: 800; line-height: 1.1; max-width: 720px; margin: 0 auto; }
    .hero p { color: var(--muted); font-size: 1.15rem; max-width: 560px; margin: 1.5rem auto; line-height: 1.7; }
    .hero-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary { background: var(--primary); color: white; padding: 0.85rem 2rem; border-radius: 10px; font-weight: 600; font-size: 1rem; text-decoration: none; transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-ghost { border: 2px solid #e5e7eb; color: var(--text); padding: 0.85rem 2rem; border-radius: 10px; font-weight: 600; font-size: 1rem; text-decoration: none; }
    .features { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; padding: 4rem 3rem; max-width: 1200px; margin: 0 auto; }
    .feature { padding: 1.75rem; border: 1px solid #e5e7eb; border-radius: 16px; }
    .feature h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .feature p { font-size: 0.95rem; color: var(--muted); line-height: 1.6; }
    .cta-section { background: linear-gradient(135deg, var(--primary), #8b5cf6); color: white; text-align: center; padding: 5rem 2rem; }
    .cta-section h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; }
    .cta-section p { font-size: 1.1rem; opacity: 0.85; margin-bottom: 2rem; }
    .btn-white { background: white; color: var(--primary); padding: 0.85rem 2.5rem; border-radius: 10px; font-weight: 700; font-size: 1rem; text-decoration: none; display: inline-block; }
    footer { text-align: center; padding: 2.5rem 2rem; color: var(--muted); font-size: 0.85rem; border-top: 1px solid #e5e7eb; }
    @media (max-width: 768px) { h1 { font-size: 2.2rem; } nav { padding: 1rem 1.5rem; } .features { padding: 2rem 1rem; } }
  </style>
</head>
<body>
  <nav>
    <span class="logo">{{TITLE}}</span>
    <a href="#features" class="nav-cta">Learn More</a>
  </nav>

  <section class="hero">
    <span class="hero-tag">✦ Powered by PDF Studio</span>
    <h1>{{TITLE}}</h1>
    <p>{{EXECUTIVE_SUMMARY}}</p>
    <div class="hero-actions">
      <a href="#features" class="btn-primary">Get Started</a>
      <a href="#content" class="btn-ghost">Learn More</a>
    </div>
  </section>

  <section id="features" class="features">
    {{KEY_TOPICS}}
  </section>

  <section id="content" style="max-width:800px;margin:0 auto;padding:3rem 2rem;">
    {{CONTENT}}
  </section>

  <section class="cta-section">
    <h2>Ready to get started?</h2>
    <p>Everything you need, converted from your document.</p>
    <a href="#" class="btn-white">Start Now →</a>
  </section>

  <footer>Generated by PDF Studio · Landing Page Template</footer>

  <script>
    // Convert list items to feature cards
    const features = document.querySelector('#features');
    const listItems = features.querySelectorAll('li');
    listItems.forEach(li => {
      const card = document.createElement('div');
      card.className = 'feature';
      card.innerHTML = `<h3>${li.textContent}</h3><p>Extracted from document.</p>`;
      features.appendChild(card);
    });
    features.querySelector('ul')?.remove();
  </script>
</body>
</html>
